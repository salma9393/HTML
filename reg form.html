<!DOCTYPE html>
<html>
<head>
<title>student enrollment</title>
</head>
<body>
<h1>registration form</h1>
<div>
<h2>student name</h2>
<label for="firstname">firstname:</label>
<input type="text" name="first name" placeholder="enter name"required>
<label for="middlename">middlename:</label>
<input type="text" name="middle name" placeholder="enter name"required>
<label for="lastname">lastname:</label>
<input type="text" name="last name" placeholder="enter name"required>
</div>
</br>
<div>
<label for="father name">father name:</label>
<input type="text" name="father name" placeholder="enter"required>
<label for="mother name">mother name:</label>
<input type="text" name="mother name" placeholder="enter"required>
</div>
</br>
<div>
<label for="nationality">nationality:</label>
<input type="text",name="nationality">
<label for="address">Address</label>
<input type="text",name="Address">
</div>
</br>
<div>
<label for="gender">gender:</label>
<label for="gender-male">male</label>
<input type="radio" name="gender-choice" value="choice-1">

<label for="gender-female">female</label>
<input type="radio" name="gender-choice" value="choice-2">

<label for="gender-others">others</label>
<input type="radio" name="gender-choice" value="choice-3">
</div

<div>
</br>
<label for="e-mail">e-mail:</label>
<input type="text" name="e-mail" placeholder="xyz@gmail.com">
<label for="mobile number">mobile number:</label>
<input type="text" name="mobile number" placeholder="000-000-0000">
</div>
<div>
</br>
<label for="birthdaymonth">birthday</label>
<select name="month">
<option value="0"selected disabled>month</option>
<option value="jan">january</option>
<option value="feb">february</option>
<option value="mar">march</option>
<option value="apr">april</option>
<option value="may">may</option>
<option value="jun">june</option>
<option value="jul">july</option>
<option value="aug">august</option>
<option value="sep">september</option>
<option value="oct">october</option>
<option value="nov">november</option>
<option value="dec">december</option>
</select>
<select name="year">
<option value="0"selected disabled>year</option>
<option value="1">2000</option>
<option value="2">2001</option>
<option value="3">2002</option>
<option value="4">2003</option>
<option value="5">2004</option>
<option value="6">2005</option>
<option value="7">2006</option>
<option value="8">2007</option>
<option value="9">2008</option>
<option value="10">2009</option>
<option value="11">2010</option>
</select>
</div>
<div>
</br>
<label for="suggestion">give suggestion</label>
<input type="text"name="give suggestion">
</div>
<label for="agree"> i agree above information is correct</label>
<input type="checkbox" name="agree">
</div>
<div>
</br>
<button type="submit">submit</button>
<button type="cancel">cancel</button>
</div>
</body>
</head>
</html>
